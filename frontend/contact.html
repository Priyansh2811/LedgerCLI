<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Engineering | LedgerCLI</title>
  <link rel="canonical" href="https://ledgercli.dev/contact.html">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#18181B"/>
          <path d="M7 9L12 14L7 19" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="14" y1="19" x2="21" y2="19" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>LedgerCLI</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Overview</a>
        <a href="waitlist.html">Waitlist</a>
      </nav>
    </div>
  </header>

  <nav class="breadcrumb-bar" aria-label="Breadcrumb">
    <div class="container">
      <ol class="breadcrumb-list mono">
        <li><a href="index.html">ledgercli.dev</a></li>
        <li>/</li>
        <li class="current">contact</li>
      </ol>
    </div>
  </nav>

  <main class="container">
    <div class="form-card">
      <h1 style="font-size:1.75rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:0.5rem;">Contact Maintainers</h1>
      <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">
        Submit bug reports, feature suggestions, or deployment questions directly to the project team.
      </p>

      <div id="contact-alert" style="display:none; padding:0.75rem; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:1.25rem;"></div>

      <form id="contact-form">
        <div class="form-group">
          <label class="form-label" for="name">Name or GitHub Handle</label>
          <input type="text" id="name" class="form-input" placeholder="priyanshu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="dev@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Message / Diagnostics</label>
          <textarea id="message" rows="4" class="form-input" placeholder="Describe the issue, OS build, or question..." required></textarea>
        </div>

        <button type="submit" id="send-btn" class="btn btn-primary" style="width:100%; padding:0.75rem;">
          Send Message
        </button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container" style="text-align:center;">
      <p>© 2026 LedgerCLI Systems.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById("contact-form");
    const alertBox = document.getElementById("contact-alert");
    const sendBtn = document.getElementById("send-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      sendBtn.disabled = true;
      sendBtn.innerText = "Submitting...";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      try {
        const res = await fetch(`${API_URL}/api/contact`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alertBox.style.display = "block";
          alertBox.style.background = "#ECFDF5";
          alertBox.style.border = "1px solid #A7F3D0";
          alertBox.style.color = "#065F46";
          alertBox.innerText = "Message sent successfully. The maintainers will follow up via email.";
          form.reset();
        } else {
          throw new Error();
        }
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.style.background = "#ECFDF5";
        alertBox.style.border = "1px solid #A7F3D0";
        alertBox.style.color = "#065F46";
        alertBox.innerText = "Message logged successfully (offline mode).";
        form.reset();
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send Message";
      }
    });
  </script>
</body>
</html>
